name: PuntoDeOro
options:
  bundleIdPrefix: com.robmass
  deploymentTarget:
    watchOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: PYTG8F6332
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PuntoDeOro:
    type: application
    platform: watchOS
    sources:
      - PuntoDeOro
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Punto de Oro
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_WKApplication: YES
  PuntoDeOroTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - PuntoDeOroTests
    dependencies:
      - target: PuntoDeOro
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PuntoDeOro:
    build:
      targets:
        PuntoDeOro: all
    test:
      targets:
        - PuntoDeOroTests
